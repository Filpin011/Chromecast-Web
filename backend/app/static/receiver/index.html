<!doctype html>
<!--
  Chromecast-Web custom Cast Web Receiver (CAF v3). Plain files, no build step.
  Served by the backend at /receiver/ ; enabled only when CAST_APP_ID is set.
  Look: the app's own TV idle image (backdrop.jpg + icon.svg, rendered by scripts/brand.py --receiver)
  with the text written live. See docs/CUSTOM_RECEIVER.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chromecast Web</title>
  <link rel="stylesheet" href="receiver.css">
  <!-- Always Google's hosted SDK (protocol-relative: same scheme as this page). -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body data-state="idle">
  <!-- The media element CAF plays into (custom UI data binding, no cast-media-player). -->
  <video class="castMediaElement" id="video"></video>
  <img id="still" alt="">

  <!-- Idle / loading / reconnecting: one branded stage, like the TV idle image: backdrop.jpg, then the
       logo with animated cast waves; the ring around it spins while loading. -->
  <section id="stage" aria-hidden="true">
    <img class="waves" src="waves.svg" alt="">
    <div class="logo"><img src="icon.svg" alt=""></div>
    <div class="ring"></div>
    <div class="copy">
      <h1 id="stage-title">Chromecast Web</h1>
      <div class="chip"><span class="dot"></span><span id="stage-status"></span></div>
    </div>
    <p id="hint" class="hint"></p>
  </section>

  <div id="clock" class="clock">--:--</div>

  <section id="overlay" aria-hidden="true">
    <div class="brand"><img src="icon.svg" alt=""><span>Chromecast Web</span></div>
    <div class="bottom">
      <img id="art" alt="">
      <div class="meta">
        <span id="live" class="live"><span class="live-dot"></span><span id="live-text"></span></span>
        <div id="title" class="title"></div>
        <div id="vod" class="vod">
          <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
          <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
        </div>
      </div>
    </div>
  </section>

  <div id="paused" class="paused" aria-hidden="true"><span></span><span></span></div>

  <script src="receiver.js"></script>
</body>
</html>
