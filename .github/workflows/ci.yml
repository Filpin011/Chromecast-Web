name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run, e.g. on the release-please branch when its PR was opened without a token that triggers workflows
  # (see release.yml and CONTRIBUTING.md).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python deps
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Install Chromium (for the @pytest.mark.browser tests)
        run: playwright install --with-deps chromium
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          CAST_DRIVER: fake
          FILTERS_AUTO_UPDATE: "false"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      # The release builds linux/amd64 + linux/arm64: build both here too, so an arm64-only break (apt/Playwright
      # deps, a missing aarch64 wheel) fails the PR instead of the release that already tagged.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build image for linux/amd64 + linux/arm64 (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the linux/amd64 image (from the cache) for the smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chromecast-web:ci
          cache-from: type=gha
      - name: "Smoke test: yt-dlp has a JavaScript runtime (deno) and the EJS solver scripts"
        run: |
          docker run --rm -i --entrypoint python chromecast-web:ci - <<'EOF'
          import subprocess
          from yt_dlp import YoutubeDL
          from yt_dlp.dependencies import yt_dlp_ejs
          runtimes = {n: r.info for n, r in YoutubeDL({"quiet": True})._js_runtimes.items() if r and r.info}
          assert any(i.supported for i in runtimes.values()), f"yt-dlp finds no supported JS runtime: {runtimes}"
          assert yt_dlp_ejs is not None, "yt-dlp-ejs is not installed"
          deno = runtimes["deno"].path
          out = subprocess.run(
              [deno, "run", "--ext=js", "--no-prompt", "--no-remote", "--no-npm", "--cached-only", "-"],
              input="console.log(6 * 7)", capture_output=True, text=True, timeout=60, check=True,
          ).stdout
          assert out.strip() == "42", out
          print("yt-dlp JS runtime: deno", runtimes["deno"].version, "| yt-dlp-ejs", yt_dlp_ejs.version)
          EOF
      - name: "Smoke test: the container starts and serves the API and the frontend"
        run: |
          docker run -d --name cw -p 8000:8000 -e CAST_DRIVER=fake -e FILTERS_AUTO_UPDATE=false chromecast-web:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<html'
      - name: Container logs
        if: always()
        run: docker logs cw || true
