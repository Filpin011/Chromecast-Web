name: Release

# release-please keeps a release PR (version in backend/pyproject.toml, backend/app/__init__.py,
# frontend/package.json + package-lock.json, and CHANGELOG.md) from the Conventional Commits on main.
# Merging it tags vX.Y.Z and creates the GitHub release; the job below builds the multi-arch Docker image
# (linux/amd64 + linux/arm64) and pushes ghcr.io/filpin011/chromecast-web:X.Y.Z and :latest. Run it manually with a
# tag to (re)publish the image of an existing release; that moves :latest only when the `latest` input is checked, so
# re-publishing an old tag never downgrades setups that pull :latest.
# Token: GitHub does not start workflows for events made with GITHUB_TOKEN, so a release PR opened with it gets no
# CI/CodeQL run and cannot satisfy main's required checks. Set the RELEASE_PLEASE_TOKEN secret (fine-grained PAT or
# GitHub App token: Contents, Pull requests and Issues read/write on this repository) so the release PR runs CI like
# any other PR. Without it the GITHUB_TOKEN fallback still works (repo setting: Actions › "Allow GitHub Actions to
# create and approve pull requests"), but CI/CodeQL must then be run by hand on the release branch (see
# CONTRIBUTING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish the image for (e.g. v0.1.0)
        required: false
      latest:
        description: Also move :latest to this tag (only when it is the newest release)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

env:
  IMAGE: ghcr.io/filpin011/chromecast-web

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  docker:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=auto would tag every type=semver build as :latest, re-published old tags included.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.latest }}
          labels: |
            org.opencontainers.image.title=Chromecast Web
            org.opencontainers.image.description=Control a Chromecast from any browser on your home LAN (unofficial)
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
